<!DOCTYPE html>
<html>
    <head>
        <title>Table</title>
    </head>
    <body>
        <style type="text/css">
            body {
                font-family: Arial, Helvetica, sans-serif;
                color: #111111;
            }

            table {
                width: 600px;
            }

            th.td {
                padding: 7px 10px 10px 10px;
            }

            th {
                text-transform: uppercase;
                letter-spacing: 0.1em;
                font-size: 90%;
                border-bottom: 2px solid #111111;
                border-top: 1px solid #999;
                text-align: left;
            }

            tr.even {
                background-color: #efefef;
            }

            tr:hover {
                background-color: #c3e6e5;
            }

            .money {
                text-align: right;
            }
            
        </style>
        <h1>First Edition Auction</h1>
        <table>
            <tr>
                <th>Author</th>
                <th>Title</th>
                <th class="money">Reserved Price</th>
                <th class="money">Current Bid</th>
            </tr>
            <tr>
                <td>E.E Cumming</td>
                <td>Tulips and Chimneys</td>
                <td class="money">$2.000.00</td>
                <td class="money">$2.642.50</td>
            </tr>
            <tr>
                <td>Charles d'Orleans</td>
                <td>Poemes</td>
                <td class="money"></td>
                <td class="money">$5.866.00</td>
            </tr>
            <tr>
                <td>T.S Elliot</td>
                <td>Poemes 1909 - 1925 </td>
                <td class="money">$3.444.65</td>
                <td class="money">$1.200.00</td>
            </tr>
            <tr>
                <td>Hello</td>
                <td>The Collosus</td>
                <td class="money"></td>
                <td class="money">$222.222.22</td>
            </tr>
        </table>
    </body>
</html>
