<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design</title>
    <style>
        h1 {
            color: red;
        }

        /* Responsive Layout with Flexbox */

        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            background: skyblue;
            padding: 0.25rem;
            flex-wrap: wrap;
        }

        .item {
            background: red;
            color: white;
            text-align: center;
            margin: 0.25rem;
            font-size: 2rem;
        }

        .wide {
            width: 300px;
        }

        /* A simple adaptive layout */
        body {
            margin: 0;
        }

        .container2 {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: orange;
            padding: 1rem;
        }

        .main {
            display: flex;
            flex-direction: row;
            flex-grow: 1;
        }

        .content {
            background: salmon;
            padding: 1rem;
            flex-grow: 1;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            background: skyblue;
            padding: 1rem;
        }

        .sidebar a {
            margin: 1rem;
            padding: 0.5rem 2rem;
            border: 1px solid black;
        }

        .sidebar2 {
            background: lime;
            padding: 1rem;
        }

        .footer {
            background: beige;
            padding: 1rem;
        }

        @media screen and (max-width:480px) {
            h1 {
                color: blue;
            }

            .item {
                background: blue;
            }
        }

        @media screen and (max-width: 700px) {
            .main {
                flex-direction: column;
            }

            .sidebar {
                flex-direction: row;
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>
    <h1>Responsive Layout with Flexbox</h1>
    <div class="container">
        <div class="item">Flex Item 1</div>
        <div class="item wide">Flex Item 2</div>
        <div class="item">Flex Item 3</div>
        <div class="item">Flex Item 4</div>
        <div class="item wide">Flex Item 5</div>
        <div class="item">Flex Item 6</div>
    </div>

    <h1>Adaptive Layout</h1>
    <div class="container2">
        <header class="header">Header</header>
        <main class="main">
            <nav class="sidebar">
                <a href="/home">Home</a>
                <a href="/about">About</a>
                <a href="/photos">Photos</a>
            </nav>
            <div class="content">
                Hello world!
            </div>
            <div class="sidebar2">
                Sidebar 2
            </div>
        </main>
        <footer class="footer">Footer</footer>
    </div>

</body>

</html>
