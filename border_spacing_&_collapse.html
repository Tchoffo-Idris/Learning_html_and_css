<!DOCTYPE html>
<html>
    <head>
        <title>Border spacing and collapse</title>
    </head>
    <body>
        <style type="text/css">
            td {
                background-color: aqua;
                padding: 10px;
                border: 3px solid orangered;
            }
            table.one {
                border-spacing: 10px;
                border-collapse: collapse;
            }
            table.two {
                border-spacing: 10px;
                border-collapse: seperate;
            }
        </style>
        <table class="one">
            <tr>
                <td>1</td>
                <td>2</td>
            </tr>
            <tr>
                <td>3</td>
                <td>4</td>
            </tr>
        </table>
        <table class="two">
            <tr>
                <td>1</td>
                <td>2</td>
            </tr>
            <tr>
                <td>3</td>
                <td>4</td>
            </tr>
        </table>
    </body>

</html>
