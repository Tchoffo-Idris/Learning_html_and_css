<!doctype html>
<html>
  <head>
    <title>Controlling Image Size</title>
    <style type="text/css">
      img.large {
        width: 500px;
        height: 500px;
      }

      img.medium {
        width: 250px;
        height: 250px;
      }

      img.small {
        width: 100px;
        height: 100px;
      }

      img.align-left {
        float: left;
        margin-right: 10px;
      }

      img.align-right {
        float: right;
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <p>
      <img
        src="faisal-BI465ksrlWs-unsplash.jpg"
        class="large"
        alt="Django for Professionals"
      />
    </p>
    <p>
      <img
        src="faisal-BI465ksrlWs-unsplash.jpg"
        class="align-left medium"
        alt="Django for Professionals"
      /><b><i>Magnolia</i></b> is a large genus that contains over 200 flowering
      plant species...
    </p>
    <p>
      <img
        src="faisal-BI465ksrlWs-unsplash.jpg"
        class="align-right small"
        alt="Django for Professionals"
      />Some magnolias, such as <i>Magnolia stellata</i> and
      <i>Magnolia soulangeana</i>, flower quite early in the spring before the
      leaves open...
    </p>
  </body>
</html>
