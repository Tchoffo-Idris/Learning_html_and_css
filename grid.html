<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        /* Basic grid */
        .container {
            display: grid;
            grid-template-columns: 10rem 10rem;
            grid-template-rows: 5rem 5rem;
            grid-auto-rows: 5rem;
            gap: 10px;
        }

        .item {
            background: lightgray;
            text-align: center;
        }

        /* Grid Sizing - Using the fr unit */
        .container2 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 5rem 5rem;
            grid-auto-rows: 5rem;
            gap: 5px;
            width: 30rem;
        }

        /* Grid Sizing - Using the repeat function */
        .container3 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 5rem);
            width: 30rem;
            gap: 5px;
        }

        /* Grid Sizing - Using the minmax function */
        .container4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeate(2, minmax(3rem, auto));
            gap: 5px;
            width: 15rem;
        }
    </style>
</head>

<body>

    <!-- Basic grid -->
    <h1>A Basic Grid</h1>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <!-- Grid Sizing - Using the fr Unit-->
    <h1>Using fr Unit</h1>
    <div class="container2">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <!-- Grid Sizing - Using the repeat function -->
    <h1>Using the repeat function</h1>
    <div class="container3">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
    </div>

    <!-- Grid Sizing - Using the minmax function -->
    <h1>Using the minmax function</h1>
    <div class="container4">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">Hello World! This is my best sentence in programming</div>
        <div class="item">8</div>
    </div>
</body>

</html>
