<!DOCTYPE html>
<html>
    <head>
        <title>Styling Bullet Points</title>
    </head>
    <body>
        <style type="text/css">
            ul {
                list-style-type: square;
            }

            ol {
                list-style-type: lower-roman;
            }

            li {
                margin: 10px 0px 0px 0px;
            }
        </style>
        <h1>This are the things I want to buy</h1>
        <ul>
            <li>Bread</li>
            <li>Rice</li>
            <li>Beans</li>
            <li>Chicken</li>
        </ul>
        <p>These are also a list of my priorities</p>
        <ol>
            <li>Car</li>
            <li>Phone</li>
            <li>House</li>
            <li>Money</li>
        </ol>
    </body>
</html>
