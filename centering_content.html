<!DOCTYPE html>
<html>
    <head>
        <title>Centering Content</title>
    </head>
    <body>
        <style type="text/css">
            body {
                text-align: center;
            }

            p {
                width: 300px;
                padding: 50px;
                border: 2px solid #0088dd;
                border-radius: 100px;
            }

            p.example {
                margin: 10px auto 10px auto;
                text-align: left;
            }

            li {
                display: inline;
                margin-right: 10px;
            }

            li.coming-soon {
                visibility: hidden;
            }

            p.one {
                box-shadow: -5px 5px #777777;
            }

            p.two {
                box-shadow: inset 0 0 10px #777777;
            }
            
            p.three {
                box-shadow: 5px 5px 5px 5px #777777;
            }

        </style>
    <p>Analog synthesizers are often said to have a
    "warmer" sound than their digital
    counterparts.</p>
    <p class="example">Analog synthesizers are often
    said to have a "warmer" sound than their
    digital counterparts.</p>
        
    <ul>
        <li>Home</li>
        <li>Product</li>
        <li class="coming-soon">Services</li>
        <li>About</li>
        <li>Contact</li>
    </ul>

    <p class="one"></p>
    <p class="two"></p>
    <p class="three"></p>


    </body>
</html>
