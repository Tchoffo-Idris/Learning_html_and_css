<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different shapes</title>
    <style>

       
        /* Heart Styling */

        .heartshape {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .heart {
            background: red;
            transform: rotate(45deg);
            width: 10rem;
            height: 10rem;
            margin: 10rem auto;
        }

        .heart::before,
        .heart::after {
            border-radius: 50%;
            content: '';
            width: 10rem;
            height: 10rem;
            position: absolute;
            background: red;
        }

        .heart::before {
            transform: translateX(-5rem);
        }

        .heart::after {
            transform: translateY(-5rem);
        }


    </style>
</head>

<body>
    <!-- A HEART -->
    <div class="heartshape">
        <h1>A Heart</h1>
        <div class="heart"></div>
    </div>

</body>

</html>
