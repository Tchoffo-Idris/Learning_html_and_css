<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different shapes</title>
    <style>
        /* Heart Styling */

        .heartshape, .cubeshape {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .heart {
            background: red;
            transform: rotate(45deg);
            width: 10rem;
            height: 10rem;
            margin: 10rem auto;
        }

        .heart::before,
        .heart::after {
            border-radius: 50%;
            content: '';
            width: 10rem;
            height: 10rem;
            position: absolute;
            background: red;
        }

        .heart::before {
            transform: translateX(-5rem);
        }

        .heart::after {
            transform: translateY(-5rem);
        }

        /* A Cube */

        .container {
            width: 10rem;
            height: 10rem;
            perspective: 500px;
            margin: 100px auto;
        }

        .cube {
            position: relative;
            width: 10rem;
            height: 10rem;
            transform-style: preserve-3d;
            transform: rotate3d(1, 1, 0, 45deg);
        }

        .face {
            width: 10rem;
            height: 10rem;
            background: skyblue;
            border: 2px solid black;
            position: absolute;
            opacity: 0.5;
            text-align: center;
        }

        .front {
            transform: translateZ(5rem);
        }

        .back {
            transform: translateZ(-5rem) rotateY(180deg);
        }

        .left {
            transform: translateX(-5rem) rotateY(-90deg);
        }

        .right {
            transform: translateX(5rem) rotateY(90deg);
        }

        .top {
            transform: translateY(-5rem) rotateX(90deg);
        }

        .bottom {
            transform: translateY(5rem) rotateX(-90deg);
        }

    </style>
</head>

<body>
    <!-- A HEART -->
    <div class="heartshape">
        <h1>A Heart</h1>
        <div class="heart"></div>
    </div>

    <!-- A CUBE -->
    <div class="cubeshape">
        <h1>A Cube</h1>
        <div class="container">
            <div class="cube">
                <div class="face top">Top</div>
                <div class="face bottom">Bottom</div>
                <div class="face left">Left</div>
                <div class="face right">Right</div>
                <div class="face front">Front</div>
                <div class="face back">Back</div>
            </div>
        </div>
    </div>

</body>

</html>
